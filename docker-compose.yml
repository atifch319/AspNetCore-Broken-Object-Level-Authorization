# Local SQL Server 2022 for the BOLA demo.
# Bind is localhost only. The SA password comes from .env (see .env.example).
# Demo credentials are local-only. Do not reuse them anywhere else.
# Do not run `docker compose down -v`; that would delete the named volume.

name: bola-demo

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bola-demo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - bola-demo-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  bola-demo-sql-data:
    name: bola-demo-sql-data
